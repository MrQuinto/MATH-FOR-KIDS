<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KIDS PLAYS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="border">
        <video autoplay muted loop id="myVideo">
            <source src="vid.mp4" type="video/mp4">
            Your browser does not support HTML5 video.
        </video>

        <div class="tittle">
            <h1>Math For Kids</h1>
        </div>

        <!-- ===== Volume control ===== -->
        <div class="volume-control">
            <button id="muteBtn" class="volume-icon-btn">🔊</button>
            <input type="range" id="volumeSlider" min="0" max="100" value="70">
        </div>

        <!-- ===== MODE SELECT SCREEN (shown first, before the game) ===== -->
        <div class="mode-select" id="modeSelect">
            <h2>Choose Your Game Mode</h2>

            <div class="mode-cards">
                <button class="mode-card" id="timerModeBtn">
                    <span class="mode-icon">⏱️</span>
                    <span class="mode-name">Timer Mode</span>
                    <span class="mode-desc">Answer as many as you can before time runs out!</span>
                </button>

                <button class="mode-card" id="lifeModeBtn">
                    <span class="mode-icon">❤️</span>
                    <span class="mode-name">Life Mode</span>
                    <span class="mode-desc">You have 3 lives. Wrong answers cost a life!</span>
                </button>
            </div>
        </div>

        <!-- ===== SCOREBOARD (visible once the game starts) ===== -->
        <div class="scoreboard hidden" id="scoreboard">
            <div class="score-item">
                <span class="score-label">Score</span>
                <span class="score-value" id="scoreValue">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">Streak</span>
                <span class="score-value" id="streakValue">0</span>
            </div>
            <div class="score-item">
                <span class="score-label">Best</span>
                <span class="score-value" id="bestStreakValue">0</span>
            </div>
            <div class="score-item" id="timerBox">
                <span class="score-label">Time</span>
                <span class="score-value" id="timeValue">30</span>
            </div>
            <div class="score-item" id="livesBox">
                <span class="score-label">Lives</span>
                <span class="score-value" id="livesValue">❤️❤️❤️</span>
            </div>
        </div>

        <!-- ===== GAME AREA (hidden until a mode is picked) ===== -->
        <div class="Category hidden" id="categoryButtons">
            <button id="addBtn"><strong>+</strong></button>
            <button id="subBtn"><strong>-</strong></button>
        </div>

        <div class="borders hidden" id="gameBox">
            <div class="numbers">
                <h2 id="First">?</h2>
                <h2 id="Math">+</h2>
                <h2 id="Second">?</h2>
            </div>

            <div class="Btns">
                <label for="Anser">Answer</label>
                <input type="text" id="Anser" name="Anser" inputmode="numeric" autocomplete="off">
                <button id="submitBtn" class="submit-btn">Submit</button>
            </div>

            <p class="feedback" id="feedback">&nbsp;</p>
        </div>

        <!-- ===== GAME OVER SCREEN ===== -->
        <div class="game-over hidden" id="gameOverScreen">
            <h2 id="gameOverTitle">Game Over!</h2>
            <p id="gameOverSummary"></p>
            <button id="playAgainBtn" class="submit-btn">Play Again</button>
        </div>

    </div>

    <!-- ===== Win / Lose video overlay (plays briefly after each answer) ===== -->
    <div class="result-overlay hidden" id="resultOverlay">
        <video id="resultVideo" muted playsinline></video>
    </div>

    <!-- ===== Sound effects ===== -->
    <audio id="winSound" src="Winning Sound Effect.mp3"></audio>
    <audio id="loseSound" src="Lose sound effects.mp3"></audio>

    <script src="script.js"></script>
</body>
</html>
